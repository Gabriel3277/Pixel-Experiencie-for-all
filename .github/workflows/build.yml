name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -20 | while read -r l; do echo "::error::$l"; done
          grep -A6 'What went wrong' build.log | head -20 | while read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-experience-debug
          path: app/build/outputs/apk/debug/*.apk
